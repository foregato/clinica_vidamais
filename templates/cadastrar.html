{% extends "base.html" %}
{% block title %}Cadastrar Paciente{% endblock %}
{% block conteudo %}
<h1>Cadastrar Paciente</h1>

<form method="POST" class="formulario">
    <label for="nome">Nome</label>
    <input type="text" id="nome" name="nome" value="{{ nome }}" placeholder="Nome completo" required>

    <label for="idade">Idade</label>
    <input type="number" id="idade" name="idade" value="{{ idade }}" min="0" max="120" placeholder="Idade" required>

    <label for="telefone">Telefone</label>
    <input type="text" id="telefone" name="telefone" value="{{ telefone }}" placeholder="(00) 00000-0000" required>

    <button type="submit" class="botao">Salvar paciente</button>
</form>
{% endblock %}
